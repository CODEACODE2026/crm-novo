name: PostgreSQL integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: postgres-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mercado-pago-postgres:
    name: Mercado Pago on synthetic PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://crm_ci:crm_ci@localhost:5432/crm_novo_ci?schema=public
      RUN_DATABASE_TESTS: "1"
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: crm_novo_ci
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d crm_novo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @crm-novo/api prisma:generate

      - name: Apply migrations to disposable database
        run: pnpm --filter @crm-novo/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: pnpm --filter @crm-novo/api exec prisma migrate status --schema prisma/schema.prisma

      - name: Run Mercado Pago PostgreSQL test without skips
        run: >-
          pnpm --filter @crm-novo/api exec vitest run
          src/finance/mercado-pago-webhook-postgres.test.ts
          --maxWorkers=1 --minWorkers=1
